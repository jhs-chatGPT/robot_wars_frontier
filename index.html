<style>

 '리얼계':{melee:-20,ranged:15,reaction:20,control:20,defense:-15,skill:10,command:-30},

function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function statTotal(stats){return STAT_KEYS.reduce((s,k)=>s+(stats[k]||0),0)}
function terrainUpgradeCost(rank){return TERRAIN_PP_COST[rank]??0}
function ensureStarterDraftRef(){let meta=pilotMetaRef();if(!registrationDraftRef)registrationDraftRef={family:meta.family,name:meta.name,age:meta.age,gender:meta.gender,type:meta.type,personality:meta.personality};return registrationDraftRef}
function starterTypeRefValue(){return ensureStarterDraftRef().type||pilotMetaRef().type||'리얼계'}
function typeAdjustedStats(meta,type){let out=clone(meta.stats);if(type!==meta.type){let adj=TYPE_SWAP_ADJUST[type]||{};for(const k of STAT_KEYS)out[k]=clamp((out[k]||0)+(adj[k]||0),100,250);let diff=1200-statTotal(out);let order=type==='리얼계'?['ranged','reaction','control','skill','command','melee','defense']:['melee','defense','command','skill','reaction','control','ranged'];for(let i=0;i<600&&diff!==0;i++){let k=order[i%order.length];if(diff>0&&out[k]<250){out[k]++;diff--}else if(diff<0&&out[k]>100){out[k]--;diff++}}}return out}
function typeAdjustedSpecial(meta,type){if(type===meta.type)return [...new Set(meta.special||[])];return [...new Set(TYPE_SPECIAL_PACK[type]||[])]}
function starterUnitsForType(type){let ids=TYPE_STARTER_UNIT_IDS[type]||TYPE_STARTER_UNIT_IDS['리얼계'];return db.units.filter(u=>ids.includes(u.id))}

function autoTournament(){let p=current().pilot,scale=p.level<50?'신인':p.level<120?'중견':'최상위',rounds=p.level<80?4:5,t={id:uid('t'),name:`AI ${scale} 챔피언십 #${db.tournaments.length+1}`,format:`${2**rounds}강 싱글 엘리미네이션`,rounds,minLv:Math.max(1,p.level-15),maxCost:null,entry:rand(1,5)*5000,prize:rand(25,90)*10000,prizeUnitId:Math.random()<.3?(()=>{let pool=db.units.filter(u=>!u.enemyOnly);return pool.length?pool[rand(0,pool.length-1)].id:null})():null,isCustom:false,status:'active',createdAt:new Date().toISOString()};db.tournaments.push(t);save();render()}
function createCustomTournament(){let u=current(),p=u.pilot,name=v('tcName').trim()||`커스텀 챔피언십 #${db.tournaments.filter(t=>t.isCustom).length+1}`,rounds=clamp(+v('tcRounds')||3,2,4),minLv=Math.max(1,+v('tcMinLv')||1),maxCost=Math.max(100,+v('tcMaxCost')||450),credit=Math.max(0,Math.floor(+v('tcCredit')||0)),pp=Math.max(0,Math.floor(+v('tcPP')||0)),prizeUnitId=v('tcPrizeUnit')||null,defense=[0,1,2,3].map(i=>({unitId:v(`tdUnit${i}`),ai:v(`tdAi${i}`)||'균형형'})).filter(x=>x.unitId),ids=defense.map(x=>x.unitId);if(!defense.length)return alert('수비 기체를 1기 이상 배치하세요.');if(new Set(ids).size!==ids.length)return alert('같은 기체를 수비 편성에 중복 배치할 수 없습니다.');if(ids.some(id=>!(p.ownedUnits||[]).includes(id)))return alert('보유하지 않은 기체가 수비 편성에 포함되어 있습니다.');if(credit>(p.credit||0))return alert('상품으로 걸 크레딧이 보유량을 초과했습니다.');if(pp>(p.pp||0))return alert('상품으로 걸 PP가 보유량을 초과했습니다.');if(prizeUnitId){if(!(p.ownedUnits||[]).includes(prizeUnitId))return alert('상품 기체를 보유하고 있지 않습니다.');if(ids.includes(prizeUnitId))return alert('상품으로 건 기체는 수비 편성에 사용할 수 없습니다.');if(prizeUnitId===p.unitId)return alert('현재 주력 기체는 상품으로 걸 수 없습니다. 다른 기체를 주력으로 지정한 후 다시 시도하세요.')}p.credit-=credit;p.pp-=pp;if(prizeUnitId)p.ownedUnits=p.ownedUnits.filter(id=>id!==prizeUnitId);let t={id:uid('t'),name,format:`${2**rounds}강 싱글 엘리미네이션`,rounds,minLv,maxCost,entry:0,prize:credit,prizeCredit:credit,prizePP:pp,prizeUnitId,creatorUserId:u.id,isCustom:true,defenseLineup:defense,status:'active',escrowLocked:true,createdAt:new Date().toISOString()};db.tournaments.push(t);save();closeTournamentHostModal();render();alert('직접 토너먼트를 개최했습니다. 우승 상품은 대회 종료 또는 삭제까지 잠금됩니다.')}
function refundTournamentEscrow(t){if(!t||!t.isCustom||!t.escrowLocked)return;let owner=tournamentOwner(t);if(!owner)return;owner.pilot.credit=(owner.pilot.credit||0)+(t.prizeCredit??t.prize??0);owner.pilot.pp=(owner.pilot.pp||0)+(t.prizePP||0);if(t.prizeUnitId&&!owner.pilot.ownedUnits.includes(t.prizeUnitId))owner.pilot.ownedUnits.push(t.prizeUnitId);t.escrowLocked=false}
function deleteTournament(id){let t=db.tournaments.find(x=>x.id===id);if(!t)return alert('대회 정보를 찾을 수 없습니다.');if(t.status==='completed')return alert('이미 종료된 대회는 삭제할 수 없습니다.');if(t.isCustom&&!isMyTournament(t))return alert('다른 사용자가 직접 개최한 대회는 삭제할 수 없습니다.');let msg=t.isCustom?`"${t.name}" 대회를 삭제할까요?\n잠긴 상품은 모두 반환됩니다.`:`"${t.name}" AI 자동 개최 대회를 삭제할까요?\n테스트 단계에서는 누구나 삭제할 수 있습니다.`;if(!confirm(msg))return;if(t.isCustom)refundTournamentEscrow(t);t.status='cancelled';db.tournaments=db.tournaments.filter(x=>x.id!==id);save();render();alert(t.isCustom?'대회를 삭제했고 잠긴 상품을 반환했습니다.':'AI 자동 개최 대회를 삭제했습니다.')}
function customDefensePilot(ownerPilot,slot){let p=clone(ownerPilot);p.unitId=slot.unitId;p.ownedUnits=[slot.unitId];p.battleAI=slot.ai||'균형형';return p}
function testTournamentDefense(id){let t=db.tournaments.find(x=>x.id===id);if(!t||!isMyTournament(t))return;let owner=current().pilot,challenger=systemOpponent(),log=[`[수비 테스트] ${t.name}`,`도전자 ${challenger.family}${challenger.name}`],cleared=0;for(let i=0;i<t.defenseLineup.length;i++){let slot=t.defenseLineup[i],def=customDefensePilot(owner,slot),unit=db.units.find(u=>u.id===slot.unitId),res=simulateTextDuel(challenger,def,'space',20);log.push(`\n===== 수비 ${i+1} · ${unit?.name||'기체'} / ${slot.ai} =====`,...res.log.slice(0,50));if(res.playerWin){cleared++;log.push('도전자가 수비선을 돌파했습니다.')}else{log.push('수비 성공! 도전자를 격퇴했습니다.');break}}log.push(cleared===t.defenseLineup.length?'\n수비 테스트 결과: 도전자가 모든 수비선을 돌파했습니다.':'\n수비 테스트 결과: 방어 성공');showTournamentResultModal('수비 테스트 결과',log)}
function payoutCustomTournament(t,winner,log){let credit=t.prizeCredit??t.prize??0,pp=t.prizePP||0;winner.credit=(winner.credit||0)+credit;winner.pp=(winner.pp||0)+pp;if(credit)log.push(`우승 크레딧 +${credit.toLocaleString()}C`);if(pp)log.push(`우승 PP +${pp.toLocaleString()}PP`);if(t.prizeUnitId&&!winner.ownedUnits.includes(t.prizeUnitId)){winner.ownedUnits.push(t.prizeUnitId);log.push(`우승 기체 획득: ${db.units.find(u=>u.id===t.prizeUnitId)?.name||'기체'}`)}t.escrowLocked=false;t.status='completed';t.winnerUserId=db.currentUserId;t.winnerName=`${winner.family||''}${winner.name||''}`;t.completedAt=new Date().toISOString()}
function enterTournament(id){
 let p=current().pilot,t=db.tournaments.find(x=>x.id===id),u=db.units.find(x=>x.id===p.unitId);
 if(!t)return alert('대회 정보를 찾을 수 없습니다.');
 if(t.status==='completed')return alert(`이미 우승자가 결정된 대회입니다.\n우승자: ${tournamentWinnerName(t)}`);
 if(t.status==='cancelled')return alert('취소된 대회입니다.');
 if(isMyTournament(t))return alert('직접 개최한 자신의 대회에는 참가할 수 없습니다. 수비 테스트를 이용하세요.');
 if(p.level<t.minLv)return alert('레벨 조건이 부족합니다.');
 if(!u)return alert('주력 기체를 먼저 지정하세요.');
 if(t.isCustom&&Number.isFinite(Number(t.maxCost))&&(u.cost||300)>Number(t.maxCost))return alert(`현재 기체 코스트 ${(u.cost||300)}가 대회 제한 ${t.maxCost}을 초과합니다.`);
 if(p.credit<(t.entry||0))return alert('참가비가 부족합니다.');
 p.credit-=(t.entry||0);
 let log=[`[${t.name}]`,`${p.family}${p.name} 참가`],wins=0,wonTournament=false;
 if(t.isCustom&&t.defenseLineup?.length){
   let owner=tournamentOwner(t);if(!owner)return alert('개최자 데이터를 찾을 수 없습니다.');
   for(let i=0;i<t.defenseLineup.length;i++){
     let slot=t.defenseLineup[i],opp=customDefensePilot(owner.pilot,slot),du=db.units.find(x=>x.id===slot.unitId),res=simulateTextDuel(p,opp,'space',20);
     log.push(`\n===== 수비 ${i+1} vs ${du?.name||'기체'} / ${slot.ai} =====`,...res.log.slice(0,50));
     if(res.playerWin){wins++;log.push(`${i+1}차 수비선 돌파`)}else{log.push(`${i+1}차 수비선에서 패배 - 탈락`);break}
   }
   if(wins===t.defenseLineup.length){p.tournamentWins++;wonTournament=true;log.push('\n직접 개최 토너먼트 우승!');payoutCustomTournament(t,p,log)}
   else{let c=wins*4000;p.credit+=c;log.push(`\n라운드 보상 +${c.toLocaleString()}C`)}
 }else{
   for(let r=1;r<=t.rounds;r++){
     let opp=tournamentOpponent(t,r),res=simulateTextDuel(p,opp,'space',18);
     log.push(`\n===== ${r}회전 vs ${opp.family}${opp.name} [${opp.enemyRankLabel||'일반 병사'}] =====`,...res.log.slice(0,45));
     if(res.playerWin){wins++;log.push(`${r}회전 승리`)}else{log.push(`${r}회전 패배 - 탈락`);break}
   }
   if(wins===t.rounds){
     p.tournamentWins++;wonTournament=true;p.credit+=(t.prize||0);log.push(`\n우승! +${Number(t.prize||0).toLocaleString()}C`);
     if(t.prizeUnitId&&!p.ownedUnits.includes(t.prizeUnitId)){p.ownedUnits.push(t.prizeUnitId);log.push(`우승 기체 획득: ${db.units.find(u=>u.id===t.prizeUnitId)?.name}`)}
     t.status='completed';t.winnerUserId=db.currentUserId;t.winnerName=`${p.family||''}${p.name||''}`;t.completedAt=new Date().toISOString();
   }else{let c=wins*4000;p.credit+=c;log.push(`\n라운드 보상 +${c.toLocaleString()}C`)}
 }
 addExp(p,wins*25+20);
 if(wonTournament){log.push(`\n최종 우승자: ${p.family||''}${p.name||''}`);t.battleLog=log.slice()}
 save();renderTop();showTournamentResultModal(`${t.name} · 결과`,log);render();
}

function passiveCombatMods(c,defending=false){let hit=0,evade=0,dmg=1,guard=1,notes=[],ratio=c.hp/c.maxHp;if(pilotHas(c,'뉴타입 Lv2')){hit+=10;evade+=10;notes.push('뉴타입 Lv2')}else if(pilotHas(c,'뉴타입')){hit+=8;evade+=8;notes.push('뉴타입')}if(pilotHas(c,'강화인간')){hit+=6;evade+=5;notes.push('강화인간')}if(pilotHas(c,'초감각')){hit+=4;evade+=4;notes.push('초감각')}if(pilotHas(c,'코디네이터')){hit+=4;evade+=3;dmg*=1.03;notes.push('코디네이터')}if(pilotHas(c,'천재')){hit+=5;evade+=5;notes.push('천재')}if(pilotHas(c,'에이스 파일럿')){hit+=4;evade+=4;dmg*=1.04;notes.push('에이스')}if(pilotHas(c,'집중력')){hit+=4;evade+=4;notes.push('집중력')}if(pilotHas(c,'정밀기동')){evade+=6;notes.push('정밀기동')}if(pilotHas(c,'회피기동')){evade+=8;notes.push('회피기동')}if(pilotHas(c,'전자전')){evade+=6;notes.push('전자전')}if(pilotHas(c,'교란')){evade+=8;notes.push('교란')}if(pilotHas(c,'전술예지')){hit+=6;evade+=6;notes.push('전술예지')}if(pilotHas(c,'분석지원')){hit+=4;dmg*=1.02;notes.push('분석지원')}if(pilotHas(c,'리더십')){hit+=2;dmg*=1.02;notes.push('리더십')}if(pilotHas(c,'전술 지휘')){hit+=4;evade+=2;dmg*=1.02;notes.push('전술 지휘')}if(pilotHas(c,'지휘관 Lv2')){hit+=4;evade+=3;dmg*=1.03;notes.push('지휘관 Lv2')}else if(pilotHas(c,'지휘관 Lv1')){hit+=2;evade+=1;dmg*=1.015;notes.push('지휘관 Lv1')}if(pilotHas(c,'간파')&&c.morale>=120){hit+=6;evade+=6;notes.push('간파')}if((pilotHas(c,'저력')||unitAbility(c,'저력 보조'))&&ratio<=.35){let lv=pilotHas(c,'저력 Lv3')?3:pilotHas(c,'저력 Lv2')?2:1;hit+=7+lv*2;evade+=3+lv;dmg*=1.08+lv*.03;guard*=Math.max(.78,.94-lv*.04);notes.push(`저력 Lv${lv}`)}if(pilotHas(c,'가드')){guard*=.9;notes.push('가드')}if(pilotHas(c,'원호방어')&&defending){guard*=.95;notes.push('원호방어')}if(pilotHas(c,'투지')){dmg*=1.05;notes.push('투지')}if(pilotHas(c,'브레이브하트')&&ratio<=.5){dmg*=1.06;guard*=.9;notes.push('브레이브하트')}if(pilotHas(c,'철벽')){guard*=.88;notes.push('철벽')}if(pilotHas(c,'혼')){dmg*=1.06;notes.push('혼')}return {hit,evade,dmg,guard,notes}}
function calcTextHit(att,def,w,terrain,effects){let ap=att.pilot,dp=def.pilot,au=db.units.find(u=>u.id===att.unitId),du=db.units.find(u=>u.id===def.unitId),as=unitStatsFor(ap,au),ds=unitStatsFor(dp,du);let atk=w.type==='근접'?ap.stats.melee:ap.stats.ranged,am=passiveCombatMods(att),dm=passiveCombatMods(def,true);let delta=(atk-dp.stats.reaction)*.075+(ap.stats.control-dp.stats.reaction)*.085+(ap.stats.skill-dp.stats.skill)*.05+(ap.stats.command-dp.stats.command)*.025;let machine=(as.aim-ds.mobility)*.12;let terrA=TERR_RANK.indexOf(effectiveTerrainRank(att,terrain)),terrD=TERR_RANK.indexOf(effectiveTerrainRank(def,terrain)),tb=(terrA-terrD)*3;let hit=55+delta+machine+w.accuracy+tb+am.hit-dm.evade+(att.morale-100)*.06;if(unitAbility(att,'정밀 사격 보정')&&w.type==='원거리')hit+=8;if(pilotHas(att,'저격')&&w.type==='원거리')hit+=6;if(pilotHas(att,'히트 앤 어웨이')&&w.type==='원거리')hit+=3;if(pilotHas(att,'강습')&&w.type==='근접')hit+=3;if(ap.isDrone)hit-=6;if(effects?.focus&&att.kind==='player')hit+=20;if(effects?.focus&&def.kind==='player')hit-=20;if(effects?.sureHit&&att.kind==='player')return 100;return Math.max(5,Math.min(100,Math.round(hit)))}
function calcTextDamage(att,def,w,terrain,effects,log,critical){let ap=att.pilot,dp=def.pilot,au=db.units.find(u=>u.id===att.unitId),du=db.units.find(u=>u.id===def.unitId),as=unitStatsFor(ap,au),ds=unitStatsFor(dp,du),atk=w.type==='근접'?ap.stats.melee:ap.stats.ranged,am=passiveCombatMods(att),dm=passiveCombatMods(def,true);let raw=w.power*as.weaponPct+atk*7+att.morale*5-(ds.armor*1.08+dp.stats.defense*5);if(pilotHas(att,'인파이트')&&w.type==='근접')am.dmg*=1.08;if(pilotHas(att,'건파이트')&&w.type==='원거리')am.dmg*=1.08;if(pilotHas(att,'원호공격'))am.dmg*=1.04;if(pilotHas(att,'강습')&&w.type==='근접')am.dmg*=1.06;let dmg=Math.max(100,Math.round(raw*terrainMod(w.terrain[terrain]||'B')*am.dmg*dm.guard));if(critical)dmg=Math.round(dmg*1.5);if(effects?.valor&&att.kind==='player'){dmg*=2;effects.valor=false;log.push('[정신기] 열혈 효과 발동 → 피해 2배')}if(effects?.wall&&def.kind==='player'){dmg=Math.max(1,Math.round(dmg/4));log.push('[정신기] 철벽 효과 발동 → 피해 1/4')}if(def.guard){dmg=Math.round(dmg*.6);log.push(`[방어] ${def.name} 방어 태세 → 피해 40% 감소`);def.guard=false}if(unitAbility(def,'빔 코팅')&&w.name.includes('빔')){dmg=Math.round(dmg*.85);log.push(`[특수능력] ${def.name}의 빔 코팅 발동 → 빔 피해 15% 감소`)}if(unitAbility(def,'중장갑')){dmg=Math.round(dmg*.9);log.push(`[특수능력] ${def.name}의 중장갑 발동 → 피해 10% 감소`)}if(unitAbility(def,'실탄 경감')&&w.ammo){dmg=Math.round(dmg*.8);log.push(`[특수능력] ${def.name}의 실탄 경감 발동 → 실탄 피해 20% 감소`)}if(unitAbility(def,'배리어')&&def.en>=10){let before=dmg;dmg=Math.max(0,dmg-600);def.en-=10;log.push(`[특수능력] ${def.name}의 배리어 발동 → 피해 ${before-dmg} 경감, EN ${def.en}/${def.maxEn}`)}let pm=partModsFor(def.pilot,def.unitId);if(pm.damageReduce){dmg=Math.max(1,Math.round(dmg*(1-pm.damageReduce)));log.push(`[강화파츠] 피해 ${Math.round(pm.damageReduce*100)}% 경감`)}if(pm.beamReduce&&w.name.includes('빔')){dmg=Math.max(1,Math.round(dmg*(1-pm.beamReduce)));log.push(`[강화파츠] 빔 피해 ${Math.round(pm.beamReduce*100)}% 경감`)}if(pm.barrier&&def.en>=(pm.barrierCost||10)){let before=dmg,cost=pm.barrierCost||10;dmg=Math.max(0,dmg-pm.barrier);de function performTextAttack(att,def,w,ctx){let log=ctx.log,effects=ctx.effects||{};startActionRecovery(att,log);if(unitAbility(def,'분신')&&rand(1,100)<=30){consumeTextWeapon(att,w);log.push(`${att.name} → ${def.name} : [${w.name}]`);log.push(`[특수능력] ${def.name}의 분신 발동! 공격을 완전히 회피했다.`);log.push(`  공격측 잔여: ${resourceAfter(att,w)}`);return}let am=passiveCombatMods(att),dm=passiveCombatMods(def);if(am.notes.length)log.push(`[특수능력] ${att.name}의 ${am.notes.join('/')} 발동 → 전투 보정 적용`);if(dm.notes.length)log.push(`[특수능력] ${def.name}의 ${dm.notes.join('/')} 발동 → 방어/회피 보정 적용`);if(unitAbility(att,'정밀 사격 보정')&&w.type==='원거리')log.push(`[특수능력] ${att.name}의 정밀 사격 보정 발동 → 명중 +8`);consumeTextWeapon(att,w);let hit=calcTextHit(att,def,w,ctx.terrain,effects);log.push(`${att.name} → ${def.name} : [${w.name}] 명중률 ${hit}%`);log.push(`  사용 후 ${resourceAfter(att,w)}`);if(rand(1,100)>hit){log.push(`  MISS! ${def.name} HP ${Math.max(0,def.hp)}/${def.maxHp}`);if(att.kind==='player')effects.sureHit=false;return}let critBonus=pilotCritBonus(att);let critChance=Math.max(0,Math.min(55,w.crit+(att.pilot.stats.skill-def.pilot.stats.skill)*.18+critBonus)),crit=rand(1,100)<=critChance,dmg=calcTextDamage(att,def,w,ctx.terrain,effects,log,crit);def.hp=Math.max(0,def.hp-dmg);att.morale=Math.min(pilotMoraleCap(att),att.morale+2);def.morale=Math.min(pilotMoraleCap(def),def.morale+1);log.push(`  ${crit?'CRITICAL! ':''}${dmg} DAMAGE → ${def.name} HP ${def.hp}/${def.maxHp}`);if(att.kind==='player')effects.sureHit=false;if(def.hp>0&&pilotHas(att,'재공격')&&att.pilot.stats.skill>def.pilot.stats.skill&&rand(1,100)<=20){let extra=Math.max(100,Math.round(dmg*.35));def.hp=Math.max(0,def.hp-extra);log.push(`[특수능력] 재공격 발동! 추가 ${extra} DAMAGE → ${def.name} HP ${def.hp}/${def.maxHp}`)}if(def.hp<=0){def.alive=false;att.morale=Math.min(pilotMoraleCap(att),att.morale+5);log.push(`  ★ ${def.name} 격추!`);if(att.kind==='player'&&current())current().pilot.kills++}}
function chooseAutoWeapon(c){let ws=db.weapons.filter(w=>w.unitId===c.unitId).filter(w=>c.en>=w.enCost&&(!w.ammo||(weaponState(c,w)?.ammoLeft||0)>0));if(!ws.length)return null;let ai=c.pilot.battleAI||'균형형';if(ai==='공격형')return ws.sort((a,b)=>b.power-a.power)[0];if(ai==='방어형')return ws.sort((a,b)=>(a.enCost+(a.ammo?10:0))-(b.enCost+(b.ammo?10:0)))[0];return ws.sort((a,b)=>(b.power+b.accuracy*12)-(a.power+a.accuracy*12))[0]}
function textBattleAttack(id){if(!battle||battle.finished)return;let en=currentTextEnemy(),w=db.weapons.find(x=>x.id===id&&x.unitId===battle.player.unitId);if(!en||!w)return;let st=weaponState(battle.player,w);if(battle.player.en<w.enCost||w.ammo&&(st?.ammoLeft||0)<=0)return alert('EN 또는 잔탄이 부족합니다.');battle.log.push(`--- ROUND ${battle.round} ---`);performTextAttack(battle.player,en,w,battle);if(!en.alive){if(!currentTextEnemy()){finishBattle('win','적 전멸');render();return}else battle.log.push(`다음 적 ${currentTextEnemy().name} 교전 진입.`)}if(!battle.finished)textEnemyResponse();render()}

function simulateTextDuel(p1,p2,terrain='space',maxRounds=20){let u1=db.units.find(u=>u.id===p1.unitId)||db.units[0],u2=db.units.find(u=>u.id===p2.unitId)||db.units[0],a=createTextCombatant('player',p1,u1,p1.family+p1.name),b=createTextCombatant('enemy',p2,u2,p2.family+p2.name),ctx={terrain,effects:{},log:[]};ctx.log.push(`[TEXT DUEL] ${a.name} / ${u1.name}  VS  ${b.name} / ${u2.name}`);for(let r=1;r<=maxRounds&&a.alive&&b.alive;r++){ctx.log.push(`--- ROUND ${r} ---`);let wa=chooseAutoWeapon(a);if(wa)performTextAttack(a,b,wa,ctx);else ctx.log.push(`${a.name}: EN/잔탄 부족으로 공격 불가.`);if(!b.alive)break;let wb=chooseAutoWeapon(b);if(wb)performTextAttack(b,a,wb,ctx);else ctx.log.push(`${b.name}: EN/잔탄 부족으로 공격 불가.`);if(!wa&&!wb)break}let playerWin=a.alive&&(!b.alive||a.hp>=b.hp);ctx.log.push(`전투 종료 → ${a.name} HP ${a.hp}/${a.maxHp}, ${b.name} HP ${b.hp}/${b.maxHp}`);ctx.log.push(playerWin?`${a.name} 승리`:`${b.name} 승리`);return {playerWin,log:ctx.log,a,b}}

function start(m){

 let cards='';for(const key of ['male','female'])PILOT_META[key].forEach((meta,i)=>{let src=avatarBySlot(key,i);cards+=`<button type="button" class="pilot-card ${selectedAvatar===src?'selected':''}" onclick="selectStarterPilot('${key}',${i})"><img src="${src}"><div class="pilot-card-info"><b>${esc(displayPilotName(meta))}</b><small>${esc(meta.title)}</small></div></button>`});

g" onclick="createPilot()">이 파일럿과 기체로 시작하기</button></section></div>`;

function metaByAvatarV8(src){for(const key of ['male','female']){let index=PILOT_AVATARS[key].indexOf(src);if(index>=0)return {key,index,meta:PILOT_META[key][index]}}return {key:'male',index:0,meta:PILOT_META.male[0]}}
function applyStarterPilot(key,index){let meta=pilotMetaBySlot(key,index);selectedAvatar=avatarBySlot(key,index);selectedPilotView={key,index};let set=(id,val)=>{let el=document.getElementById(id);if(el)el.value=val};set('family',meta.family);set('name',meta.name);set('age',meta.age);set('gender',meta.gender);set('ptype',meta.type);set('personality',meta.personality);let n=document.getElementById('selPilotName');if(n)n.textContent=displayPilotName(meta);let t=document.getElementById('selPilotTitle');if(t)t.textContent=meta.title;let q=document.getElementById('selPilotQuote');if(q)q.textContent='「 '+meta.quote+' 」';let im=document.getElementById('selPilotImg');if(im)im.src=selectedAvatar;document.querySelectorAll('.pilot-card').forEach((x,i)=>x.classList.toggle('selected',x.querySelector('img')?.getAttribute('src')===selectedAvatar));refreshStarterUnits()}

function createPilot(){let account=v('account').trim();if(!account)return alert('계정명을 입력하세요.');if(db.users.some(u=>u.account===account))return alert('이미 존재하는 계정명입니다.');let meta=pilotMetaBySlot(selectedPilotView.key,selectedPilotView.index),type=v('ptype')||meta.type,personality=meta.personality,gender=meta.gender;let special=[];if(Math.random()<.18)special.push(type==='리얼계'?'초감각 Lv1':'저력 Lv1');special=[...new Set([...(typeAdjustedSpecial(meta,type)||[]),...special])];let unitId=selectedStarterUnitId||starterUnitsForType(type)[0]?.id||'u1';let p=normalizePilot({family:meta.family,name:meta.name,age:meta.age,gender,type,personality,avatar:selectedAvatar,level:1,exp:0,sp:50,credit:100000,pp:320,stats:typeAdjustedStats(meta,type),special,terrain:clone(meta.terrain),unitId,ownedUnits:[unitId]});let u={id:uid('usr'),account,pilot:p};db.users.push(u);db.currentUserId=u.id;save();page='home';render()}
function getNextScenario(p){let idx=0;while(idx<db.scenarios.length&&p.scenarioClears.includes(db.scenarios[idx].id))idx++;return idx<db.scenarios.length?db.scenarios[idx]:null}
function home(m){let p=current().pilot,u=db.units.find(x=>x.id===p.unitId),us=u?unitStatsFor(p,u):null,need=expNeed(p.level),next=getNextScenario(p);m.innerHTML=`<div class="screen-head"><div><small>TACTICAL COMMAND / HOME</small><h1>작전 지휘실</h1></div><div class="screen-code">COMMANDER ${esc(p.family+p.name)} · ONLINE</div></div><div class="home-v8"><section class="ui-panel home-banner-v8"><div><h1>아직 끝나지 않았다.<br>우리가 지키고 싶은 세상이 있으니까.</h1><p>파일럿을 성장시키고 기체를 개발해 시나리오, PvP, 토너먼트에 도전하십시오. 모든 전투는 거리와 무장 상태를 반영한 텍스트 전투로 진행됩니다.</p></div></section><div class="home-core-grid"><section class="ui-panel current-pilot-panel"><div class="panel-head"><b>CURRENT PILOT</b><small>현재 파일럿</small></div><div class="current-pilot-body"><img src="${esc(p.avatar)}"><div><h2>${esc(p.family+p.name)}</h2><div class="muted">${p.type} · ${p.personality} · Lv.${p.level}</div><div style="margin:10px 0">EXP ${p.exp}/${need}</div><div class="bar"><i style="width:${Math.min(100,p.exp/need*100)}%"></i></div><p style="margin-top:14px">「 ${esc(metaByAvatarV8(p.avatar).meta.quote)} 」</p><button class="btn" onclick="go('pilot')">파일럿 상세 보기</button></div></div></section><section class="ui-panel current-unit-panel"><div class="panel-head"><b>MAIN UNIT</b><small>주력 기체</small></div><div class="current-unit-body"><img src="${esc(u?.image||'')}"><div><h2>${esc(u?.name||'기체 없음')}</h2><div class="home-stat-list">${us?`<div><span>HP</span><b>${us.hp}</b></div><div><span>EN</span><b>${us.en}</b></div><div><span>이동력</span><b>${us.move}</b></div><div><span>운동성</span><b>${us.mobility}</b></div><div><span>장갑</span><b>${us.armor}</b></div><div><span>조준</span><b>${us.aim}</b></div>`:''}</div><button class="btn" onclick="go('hangar')" style="margin-top:10px">기체 상세 보기</button></div></div></section><section class="ui-panel info-panel"><div class="panel-head"><b>INFORMATION</b><small>작전 정보</small></div><div class="notice-list"><li><span>공지</span><b>v0.8 거리 기반 전투 시스템 적용</b></li><li><span>시스템</span><b>기체별 무장 확장 완료</b></li><li><span>PvP</span><b>AI가 사거리와 자원을 고려해 행동</b></li><li><span>대회</span><b>텍스트 로그에 거리/EN/잔탄 표시</b></li></div></section></div><div class="next-quick-grid"><section class="ui-panel"><div class="panel-head"><b>NEXT MISSION</b><small>다음 작전</small></div>${next?`<div class="mission-next-card"><div><h2>${esc(next.title)}</h2><p>${esc(next.desc)}</p><div><span class="pill">${TERR_KO[next.terrain]}</span><span class="pill">적 ${next.enemyCount}기</span><span class="pill">Lv.${next.enemyLevel}</span></div></div><div><div class="home-stat-list"><div><span>보상</span><b>${next.rewardCredit.toLocaleString()} C</b></div><div><span>EXP</span><b>${next.rewardExp}</b></div><div><span>PP</span><b>${scenarioPPReward(next)}</b></div><div><span>적 기체</span><b>${esc(scenarioEnemyUnitSummary(next)||'-')}</b></div></div><button class="sortie-btn" style="width:100%;font-size:22px;margin-top:12px" onclick="go('scenario')">작전 개시</button></div></div>`:'모든 작전 완료'}</section><section class="ui-panel"><div class="panel-head"><b>QUICK MENU</b><small>바로가기</small></div><div class="quick-grid"><button class="quick-btn" onclick="go('pilot')"><b>파일럿 육성</b><small>PILOT</small></button><button class="quick-btn" onclick="go('hangar')"><b>기체 개발</b><small>DEVELOP</small></button><button class="quick-btn" onclick="go('pvp')"><b>PvP</b><small>ARENA</small></button><button class="quick-btn" onclick="go('tourney')"><b>대회</b><small>TOURNAMENT</small></button></div></section></div></div>`}
function profileDataFor(key,index){let meta=pilotMetaBySlot(key,index),avatar=avatarBySlot(key,index),u=current(),p=u?.pilot,isCurrent=!!p&&p.avatar===avatar,owned=rosterMemberByAvatarRef(avatar);let data=owned||null;return {meta,avatar,isCurrent,isOwned:!!owned,name:data?(data.family+data.name):displayPilotName(meta),type:data?(data.type||meta.type):meta.type,stats:data?data.stats:meta.stats,terrain:data?data.terrain:meta.terrain,special:data?[...new Set([...(meta.special||[]),...(data.special||[])])]:meta.special,spirits:data?(data.spirits||[]):['집중','가속','직감'],level:data?data.level:1,sp:data?data.sp:50,kills:data?data.kills:0}}

function pilot(m){let data=profileDataFor(selectedPilotView.key,selectedPilotView.index),meta=data.meta,total=STAT_KEYS.reduce((s,k)=>s+(data.stats[k]||0),0);let list='';for(const key of ['male','female'])PILOT_META[key].forEach((x,i)=>{let d=profileDataFor(key,i);list+=`<button class="pilot-list-item ${selectedPilotView.key===key&&selectedPilotView.index===i?'active':''}" onclick="selectPilotView('${key}',${i})"><img src="${avatarBySlot(key,i)}"><div><b>${esc(d.name)}</b><small>${esc(x.title)}${d.isCurrent?' · CURRENT':''}</small></div></button>`});m.innerHTML=`<div class="screen-head"><div><small>PILOT MANAGEMENT</small><h1>주력 파일럿</h1></div><div class="screen-code">PILOT DATABASE</div></div><div class="pilot-manage-grid"><section class="ui-panel"><div class="panel-head"><b>파일럿 리스트</b><small>PILOT LIST</small></div><div class="pilot-list-v8">${list}</div></section><section class="ui-panel pilot-detail-v8"><div class="pilot-detail-head"><div class="pilot-detail-copy"><div class="hero-eyebrow">PILOT PROFILE</div><h1>${esc(data.name)}</h1><h3 style="color:#75d1ff">${esc(meta.title)}</h3><p style="font-size:18px">「 ${esc(meta.quote)} 」</p><div class="pilot-profile-table"><span>나이</span><b>${meta.age}</b><span>성별</span><b>${meta.gender}</b><span>유형</span><b>${meta.type}</b><span>성격</span><b>${meta.personality}</b><span>좋아하는 것</span><b>${esc(meta.likes)}</b><span>싫어하는 것</span><b>${esc(meta.dislikes)}</b></div><div class="pilot-description">${esc(meta.desc)}</div><div style="margin-top:16px"><b>특수능력</b><div>${(data.special||[]).map(s=>`<span class="pill">${esc(s)}</span>`).join('')||'<span class="muted">없음</span>'}</div></div><div style="margin-top:12px"><b>정신기</b><div>${(data.spirits||[]).map(s=>`<span class="pill">${esc(s)}${spiritCatalog[s]?` · ${spiritCatalog[s].sp}SP`:''}</span>`).join('')}</div></div></div><img class="pilot-fullbody" src="${esc(meta.fullbody)}" alt="${esc(data.name)} 전신"></div></section><section class="pilot-side-v8"><div class="ui-panel"><div class="panel-head"><b>능력치</b><small>Lv.${data.level}</small></div><div class="stat-v8-grid">${STAT_KEYS.map(k=>`<div><span>${STAT_KO[k]}</span><b>${data.stats[k]}</b></div>`).join('')}<div><span>총합</span><b style="color:#ffd76a">${total}</b></div></div></div><div class="ui-panel"><div class="panel-head"><b>지형 적응</b><small>TERRAIN</small></div><div class="terrain-v8">${Object.keys(TERR_KO).map(k=>`<div><span>${TERR_KO[k]}</span><br><b>${data.terrain[k]}</b></div>`).join('')}</div></div>${data.isCurrent?`<div class="ui-panel"><b>현재 주력 파일럿</b><p class="muted">SP ${data.sp} · 격추 ${data.kills}</p><button class="btn primary" onclick="go('home')">홈으로 돌아가기</button></div>`:''}</section></div>`}
function hangar(m){let p=current().pilot,owned=db.units.filter(u=>p.ownedUnits.includes(u.id));if(!owned.length){p.ownedUnits=['u1'];owned=[db.units.find(u=>u.id==='u1')]};if(!selectedHangarUnitId||!owned.some(u=>u.id===selectedHangarUnitId))selectedHangarUnitId=p.unitId&&owned.some(u=>u.id===p.unitId)?p.unitId:owned[0].id;let sel=owned.find(u=>u.id===selectedHangarUnitId),s=unitStatsFor(p,sel),up=upgradeFor(p,sel.id),eq=p.equippedParts[sel.id]||[],ws=db.weapons.filter(w=>w.unitId===sel.id).sort((a,b)=>a.power-b.power);m.innerHTML=`<div class="screen-head"><div><small>UNIT DEVELOP / HANGAR</small><h1>기체 개발</h1></div><div class="screen-code">OWNED ${owned.length} UNITS</div></div><div class="hangar-v8"><section class="ui-panel"><div class="panel-head"><b>보유 기체 목록</b><small>OWNED UNITS</small></div><div class="owned-unit-list">${owned.map(u=>`<button class="owned-unit-row ${u.id===sel.id?'active':''}" onclick="selectHangarUnit('${u.id}')"><b>${esc(u.name)} ${p.unitId===u.id?'[탑승중]':''}</b><small>${u.size} · ${u.types.join('/')} · COST ${u.cost}</small></button>`).join('')}</div></section><section><div class="hangar-detail"><section class="ui-panel hangar-art"><div class="hero-eyebrow">SELECTED UNIT</div><h2>${esc(sel.name)}</h2><img src="${esc(sel.image||'')}"><button class="btn primary" onclick="boardUnit('${sel.id}')">${p.unitId===sel.id?'현재 탑승기체':'이 기체에 탑승'}</button></section><section><div class="ui-panel"><div class="panel-head"><b>기체 스테이터스</b><small>UNIT SPEC</small></div><div class="spec-grid"><div class="spec-box"><span>HP</span><b>${s.hp}</b></div><div class="spec-box"><span>EN</span><b>${s.en}</b></div><div class="spec-box"><span>MOVE</span><b>${s.move}</b></div><div class="spec-box"><span>MOBILITY</span><b>${s.mobility}</b></div><div class="spec-box"><span>ARMOR</span><b>${s.armor}</b></div><div class="spec-box"><span>AIM</span><b>${s.aim}</b></div><div class="spec-box"><span>UNIT COST</span><b>${sel.cost??300}</b></div></div><div style="margin-top:12px"><b> function scenario(m){
 let p=current().pilot,unlock=1;

function simulateTextDuel(p1,p2,terrain='space',maxRounds=20){let u1=db.units.find(u=>u.id===p1.unitId)||db.units[0],u2=db.units.find(u=>u.id===p2.unitId)||db.units[0],a=createTextCombatant('player',p1,u1,p1.family+p1.name),b=createTextCombatant('enemy',p2,u2,p2.family+p2.name),ctx={terrain,distance:rand(10,14),effects:{},log:[]};ctx.log.push(`[TEXT DUEL] ${a.name} / ${u1.name}  VS  ${b.name} / ${u2.name}`);ctx.log.push(`최초 교전 거리 ${ctx.distance}`);for(let r=1;r<=maxRounds&&a.alive&&b.alive;r++){ctx.log.push(`--- ROUND ${r} · 거리 ${ctx.distance} ---`);autoManeuver(a,b,ctx);let wa=chooseAutoWeapon(a,ctx.distance,b);if(wa)performTextAttack(a,b,wa,ctx);else ctx.log.push(`${a.name}: 공격 가능 무장 없음.`);if(!b.alive)break;autoManeuver(b,a,ctx);let wb=chooseAutoWeapon(b,ctx.distance,a);if(wb)performTextAttack(b,a,wb,ctx);else ctx.log.push(`${b.name}: 공격 가능 무장 없음.`);if(!wa&&!wb&&ctx.distance===16)break}let playerWin=a.alive&&(!b.alive||a.hp>=b.hp);ctx.log.push(`전투 종료 → ${a.name} HP ${a.hp}/${a.maxHp}, ${b.name} HP ${b.hp}/${b.maxHp}, 최종 거리 ${ctx.distance}`);ctx.log.push(playerWin?`${a.name} 승리`:`${b.name} 승리`);return {playerWin,log:ctx.log,a,b}}

function shopPage(m){m.innerHTML=`<div class="screen-head"><div><small>SHOP</small><h1>상점</h1></div></div><div class="grid g3">${Object.values(partCatalog).map(x=>`<section class="ui-panel"><h2>${x.name}</h2><p>${x.desc}</p><button class="btn" onclick="buyPartRef('${x.id}')">${Number(x.price||25000).toLocaleString()} C 구매</button></section>`).join('')}</div>`}

function encyclopediaPage(m){m.innerHTML=`<div class="screen-head"><div><small>ENCYCLOPEDIA</small><h1>도감</h1></div></div><div class="grid g3">${db.units.filter(u=>!u.enemyOnly).map(u=>`<section class="ui-panel"><div class="unit-art-stage" style="--unit:url('${esc(u.image)}');height:230px"><img src="${esc(u.image)}"></div><h2>${esc(u.name)}</h2><p class="muted">HP ${u.hp} · EN ${u.en} · MOVE ${u.move}</p></section>`).join('')}</div>`}
function optionPage(m){m.innerHTML=`<div class="screen-head"><div><small>OPTION</small><h1>설정</h1></div></div><section class="ui-panel"><label><input type="checkbox" ${db.settings.aiTournament?'checked':''} onchange="db.settings.aiTournament=this.checked;save()"> AI 자동 대회 개최</label><p class="muted">ROBOT WARS FRONTIER v0.8 P15.6.23 · 안정화 빌드</p></section>`}
function savePage(m){m.innerHTML=`<div class="screen-head"><div><small>SAVE / LOAD</small><h1>저장 / 불러오기</h1></div></div><section class="ui-panel"><p>게임 데이터는 브라우저 로컬 저장소에 자동 저장됩니다.</p><div class="hrow"><button class="btn primary" onclick="save();alert('저장했습니다.')">저장</button><button class="btn" onclick="location.reload()">불러오기</button><button class="btn" onclick="exportData()">JSON 백업 다운로드</button><button class="btn" onclick="document.getElementById('p15Import').click()">JSON 복원</button><input id="p15Import" type="file" accept="application/json" hidden onchange="importData(this.files[0])"></div></section>`}
function titlePage(m){m.innerHTML=`<div class="screen-head"><div><small>TITLE</small><h1>타이틀로</h1></div></div><section class="ui-panel"><p>진행 데이터는 브라우저에 자동 저장됩니다. 타이틀로 돌아가도 이어서 할 수 있습니다.</p><button class="btn primary" onclick="registrationStepRef='title';page='start';render()">타이틀로 이동</button></section>`}
function go(p){if(p==='battle'&&!battle){alert('작전 출격에서 전장을 선택하세요.');p='scenario'}if(p==='pilot'&&current()){let info=metaByAvatarV8(current().pilot.avatar);selectedPilotView={key:info.key,index:info.index}}page=p;render()}

// AppDeploy P15.6.23 heuristic runtime patch guard: native P15.6.22+ game is self-contained.
window.__frontierP15623=true;
render();
</script>
